<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Pong</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            margin: 20px;
        }

        canvas {
            background: black;
            border: 2px solid white;
            max-width: 95%;
        }
    </style>
</head>

<body>

<h1>Мой первый Pong</h1>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let playerY = 200;
let enemyY = 200;

let ballX = 400;
let ballY = 250;

let ballSpeedX = 5;
let ballSpeedY = 3;

let playerScore = 0;
let enemyScore = 0;

function game() {

    ballX += ballSpeedX;
    ballY += ballSpeedY;

    if (ballY <= 0 || ballY >= canvas.height) {
        ballSpeedY *= -1;
    }

    if (ballX <= 20 &&
        ballY >= playerY &&
        ballY <= playerY + 100) {
        ballSpeedX *= -1;
    }

    if (ballX >= canvas.width - 20 &&
        ballY >= enemyY &&
        ballY <= enemyY + 100) {
        ballSpeedX *= -1;
    }

    if (ballX < 0) {
        enemyScore++;
        ballX = 400;
        ballY = 250;
    }

    if (ballX > canvas.width) {
        playerScore++;
        ballX = 400;
        ballY = 250;
    }

    enemyY += (ballY - (enemyY + 50)) * 0.05;

    draw();
    requestAnimationFrame(game);
}

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";

    // игрок
    ctx.fillRect(10, playerY, 10, 100);

    // противник
    ctx.fillRect(canvas.width - 20, enemyY, 10, 100);

    // мяч
    ctx.beginPath();
    ctx.arc(ballX, ballY, 10, 0, Math.PI * 2);
    ctx.fill();

    // счёт
    ctx.font = "30px Arial";
    ctx.fillText(playerScore, 300, 40);
    ctx.fillText(enemyScore, 480, 40);
}

document.addEventListener("mousemove", function(event) {
    const rect = canvas.getBoundingClientRect();

    playerY =
        event.clientY - rect.top - 50;
});

game();
</script>

</body>
</html>
